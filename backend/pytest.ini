[pytest]
testpaths = tests
asyncio_mode = auto
# Fixtures must share the test's own event loop: an asyncpg connection opened
# on one loop cannot be driven from another. Only the schema fixture opts into
# the session loop, via loop_scope on the fixture itself.
asyncio_default_fixture_loop_scope = function
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning:passlib.*
